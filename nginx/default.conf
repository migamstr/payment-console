# 示例边缘层 —— 复刻真实系统的"多层防护"。
#
# 真实结构：CDN → WAF(关键词黑名单) → openresty → Spring Boot
# 这里只复刻最后一跳的关键行为：
#   ① /actuator/* 被关键词黑名单拦（返回 403，不是 404）
#   ② 未路由路径回落到前端 index（SPA 兜底）—— 这是最容易误判的地方
#   ③ 上游用 X-Real-IP 透传真实 IP（但应用侧不读，见 IframeIpWhitelist）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ── ① 边缘关键词黑名单（复刻 WAF 行为）────────────────
    location ~* /(actuator|heapdump|threaddump|jolokia|logfile) {
        default_type text/plain;
        return 403 "403 forbidden";
    }

    # ── ② Druid 监控页走另一个上游（复刻真实的分流）──────
    location /druid/ {
        proxy_pass http://gateway:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── ③ 聚合网关 ────────────────────────────────────────
    location /api/ {
        proxy_pass http://gateway:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /v2/api-docs {
        proxy_pass http://gateway:8081;
        proxy_set_header Host              $host;
    }

    # ── ④ 控制台 ──────────────────────────────────────────
    location / {
        proxy_pass http://console:8080;
        proxy_set_header Host              $host;
        # ⚠️ 这里故意透传真实 IP，但应用侧 iframeLogin 不读它
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
