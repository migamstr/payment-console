server:
  port: 8080
  servlet:
    context-path: /
    session:
      cookie:
        name: LABSESSION

spring:
  application:
    name: payment-console
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/payment_lab?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: lab
    password: lab_p@ss_2026
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        allow:
        login-username: admin
        login-password: admin
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

lab:
  jwt:
    secret: abcdefghijklmnopqrstuvwxyz
    expire-minutes: 720
  iframe:
    ip-allowlist: "127.0.0.1,172.16.0.0/12,198.51.100.0/24"
    timestamp-window-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.lab: DEBUG

---
# H2：本地 / 测试环境。启动时自动建表 + 灌数据。
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:payment_lab;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: 
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
  h2:
    console:
      enabled: true
      path: /h2-console
